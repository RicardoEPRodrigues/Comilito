[package]
name = "comilito"
version = "0.1.0"
description = "A soundboard and mixer for Dungeons & Dragons DMs"
authors = ["Ricardo Rodrigues"]
license = "MIT"
edition = "2024"

[lib]
# Tauri needs the app as a library so the same code can be the desktop binary (main.rs)
# and, later, the Android entry point. The `_lib` suffix avoids a name clash with the
# binary on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "comilito_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kira = "0.12.6"
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
trash = "5"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.11"
tauri-plugin-opener = "2"
ebur128 = "0.1"
# kira decodes through symphonia. Enabling AAC in MP4 here turns it on for kira too (Cargo
# builds one symphonia with every requested feature), so downloaded .m4a audio plays (0019).
symphonia = { version = "0.6", default-features = false, features = ["aac", "isomp4"] }
# HTTP downloads: direct audio links and the yt-dlp / ffmpeg tools (decision 0019).
# Small, blocking (no async runtime) and bundles its own TLS, so it works the same everywhere.
ureq = "3"

# Reading the desktop's accent colour from the XDG portal (desktop.rs). zbus is already in
# the build through tauri-plugin-opener, so this adds no new code.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

# Optimize dependencies (kira, its decoders, ebur128...) even in debug builds: decoding and
# measuring audio unoptimized is many times slower. Our own code stays unoptimized, so it
# still compiles quickly and debugs well. Only the first build after this takes longer.
[profile.dev.package."*"]
opt-level = 2

# Smaller, faster release builds: https://v2.tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
