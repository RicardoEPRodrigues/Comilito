# Publishes the website to GitHub Pages (decision 0060). The repository's Pages source must be
# set to "GitHub Actions" (Settings › Pages), which lets the site live in website/ instead of the
# root or docs/.
name: Website

on:
  push:
    branches: [main]
    # Everything scripts/build-website.py takes from the repository.
    paths:
      - "website/**"
      - "extras/themes/**"
      - "docs/images/screenshot.png"
      - "src/assets/skeletal-horse.svg"
      - "src-tauri/icons/128x128@2x.png"
      - "scripts/build-website.py"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push doesn't cancel one already deploying.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the website
        run: python3 scripts/build-website.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/website
      - id: deployment
        uses: actions/deploy-pages@v4
