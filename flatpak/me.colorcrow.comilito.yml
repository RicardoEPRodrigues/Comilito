# Flatpak manifest for Flathub (decisions 0059, 0061): builds a released version, from its git
# tag. For builds of the working folder, see me.colorcrow.comilito.local.yml; docs/flatpak.md
# says how to build either.
#
# Flathub builds without network access, so every Rust crate and npm package is listed as a
# source: cargo-sources.json and node-sources.json, generated from the lock files with
# flatpak-builder-tools. `npm run release` regenerates them and sets the tag and commit below.
id: me.colorcrow.comilito
# GNOME's runtime carries WebKitGTK 4.1 (Tauri's webview) and GStreamer with the plugins its
# <video> needs (VP8/VP9, Matroska/WebM, AV1, NVIDIA's decoders).
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: comilito

finish-args:
  # The window: Wayland, with X11 only where there's no Wayland. `ipc` is needed by X11.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # OpenGL for WebKit, and the GPU for decoding and encoding videos (decisions 0051, 0052).
  - --device=dri
  # Audio output (kira, through cpal's PulseAudio host; PipeWire serves it too).
  - --socket=pulseaudio
  # Downloading audio and videos from links, and the yt-dlp and ffmpeg tools (decision 0019).
  - --share=network
  # Projects are folders with relative paths inside, in ~/Documents/Comilito by default but
  # anywhere the user chooses (decision 0042). The file chooser portal would hand back
  # per-file paths under /run/user/…, which a project folder can't work with. Other disks and
  # removable drives too, where many keep their campaigns: /media (Debian, Ubuntu), /run/media
  # (Fedora, Arch), /mnt (by hand). A folder the app can reach comes back from the file chooser
  # as its real path; anywhere else, as a read-only copy Comilito refuses (flatpak.rs).
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
  # The OS media controls (MPRIS, decision 0030): souvlaki registers this name.
  - --own-name=org.mpris.MediaPlayer2.comilito
  # "Show in folder" selects the file in the file manager; without this it falls back to the
  # portal, which tauri-plugin-opener calls in a way that fails.
  - --talk-name=org.freedesktop.FileManager1

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin

modules:
  - name: comilito
    buildsystem: simple
    build-options:
      env:
        # Where the generated sources put the vendored crates and the npm cache.
        CARGO_HOME: /run/build/comilito/cargo
        CARGO_NET_OFFLINE: 'true'
        npm_config_cache: /run/build/comilito/flatpak-node/npm-cache
        npm_config_offline: 'true'
        XDG_CACHE_HOME: /run/build/comilito/flatpak-node/cache
    build-commands:
      # The frontend (Vite builds the Svelte app into dist/).
      - npm ci --offline
      - npm run build
      # The app, with the frontend built in. `tauri build` would add this feature itself; plain
      # Cargo avoids needing the Tauri CLI's native binary. `--locked`: exactly Cargo.lock.
      - cargo build --release --locked --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/comilito /app/bin/comilito
      # Tauri looks for bundled resources in ../lib/<productName> next to the binary.
      - mkdir -p /app/lib/Comilito
      - cp -r src-tauri/resources/sample /app/lib/Comilito/sample
      - install -Dm644 flatpak/me.colorcrow.comilito.desktop /app/share/applications/me.colorcrow.comilito.desktop
      - install -Dm644 flatpak/me.colorcrow.comilito.metainfo.xml /app/share/metainfo/me.colorcrow.comilito.metainfo.xml
      - |
        for size in 32 48 64 128 256 512; do
          install -Dm644 src-tauri/icons/${size}x${size}.png \
            /app/share/icons/hicolor/${size}x${size}/apps/me.colorcrow.comilito.png
        done
    sources:
      - type: git
        url: https://github.com/RicardoEPRodrigues/Comilito.git
        tag: v0.2.0
        # Quoted: YAML would read a hash made only of digits (or like 1e5…) as a number.
        commit: '0000000000000000000000000000000000000000'
      - cargo-sources.json
      - node-sources.json
